name: travelease
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ">=3.13.1 <4.0.0"
  flutter: ">=3.47.1 <4.0.0"

dependencies:
  app_links: ^7.0.0
  camera: ^0.12.0+2
  flutter:
    sdk: flutter
  flutter_tts: ^4.2.5
  go_router: ^17.3.0
  google_fonts: ^8.2.0
  record: 6.2.1
  shared_preferences: ^2.5.5
  share_plus: ^13.3.0
  speech_to_text: ^7.4.0
  supabase_flutter: ^2.8.0
  # 2.8.2 resolved video_player_android 2.4.17, which uses Flutter's removed
  # v1 Android embedding (PluginRegistry.Registrar). Keep the tested version.
  video_player: 2.14.0
  path_provider: ^2.1.0
  google_maps_flutter: ^2.10.0
  http: ^1.6.0
  geolocator: ^14.0.3
  flutter_webrtc: ^0.12.3
  permission_handler: ^12.0.0+1
  tflite_flutter: 0.12.1
  flutter_dotenv: ^6.0.1
  flutter_local_notifications: ^22.2.0
  # Pinned to the version validated by the project toolchain.
  torch_light: ^1.1.0
  flutter_background_service: ^5.1.0
  image_picker: ^1.1.2
  # Keep the lockfile-resolved version consistent across machines.
  audioplayers: ^6.7.1
  huawei_ml_language: ^3.13.0+301
  google_mlkit_pose_detection: ^0.12.0
  hand_landmarker: 3.0.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/models/
    - assets/signs/bim/
    - assets/signs/asl/
    - .env
