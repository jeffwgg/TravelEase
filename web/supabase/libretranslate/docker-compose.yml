services:
  libretranslate:
    image: libretranslate/libretranslate:latest
    container_name: travelease-libretranslate
    restart: unless-stopped
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD-SHELL", "./venv/bin/python scripts/healthcheck.py"]
      interval: 10s
      timeout: 4s
      retries: 12
      start_period: 60s
    environment:
      LT_HOST: 0.0.0.0
      LT_PORT: 5000
      LT_LOAD_ONLY: en,ms,zh
      LT_UPDATE_MODELS: "true"
      LT_DISABLE_WEB_UI: "true"
      LT_DISABLE_FILES_TRANSLATION: "true"
      LT_API_KEYS: "true"
      LT_API_KEYS_DB_PATH: /app/db/api_keys.db
      # A zero limit rejects every request ("Slowdown: 0 per 1 minute").
      # Keep a finite guardrail while allowing normal announcement translation.
      LT_REQ_LIMIT: "120"
      LT_CHAR_LIMIT: "5000"
    volumes:
      - libretranslate_models:/home/libretranslate/.local:rw
      - libretranslate_api_keys:/app/db:rw

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: travelease-translation-tunnel
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://libretranslate:5000
    depends_on:
      libretranslate:
        condition: service_healthy

volumes:
  libretranslate_models:
  libretranslate_api_keys:
